<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, #0f0f10, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

/* Плеер */
.player {
    width: 320px;
    padding: 20px;
    border-radius: 30px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(25px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

/* Обложка */
.cover {
    width: 100%;
    height: 180px;
    border-radius: 20px;
    background-size: cover;
    background-position: center;
    margin-bottom: 15px;
    transition: 0.5s;
    background-color: #1a1a1a;
    position: relative;
    overflow: hidden;
}

/* Анимация загрузки */
.cover::before {
    content: "🎵";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 40px;
    opacity: 0.3;
    z-index: 0;
}

/* Текст */
.title {
    font-size: 18px;
    font-weight: 600;
}

.subtitle {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 10px;
}

/* Кнопки */
.controls {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

button {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: none;
    font-size: 20px;
    background: rgba(255,255,255,0.1);
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: rgba(255,255,255,0.3);
}

.play {
    width: 70px;
    height: 70px;
    font-size: 24px;
}

/* список */
.list {
    margin-top: 15px;
    max-height: 100px;
    overflow-y: auto;
    padding-right: 5px;
    scroll-behavior: smooth;
}

/* iPhone-style скролл */
.list::-webkit-scrollbar {
    width: 6px;
}

.list::-webkit-scrollbar-track {
    background: transparent;
}

.list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    transition: 0.2s;
}

.list::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.5);
}

/* элементы */
.station {
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
}

.station:hover {
    background: rgba(255,255,255,0.1);
}

.station.active {
    background: rgba(255,255,255,0.15);
    border-left: 3px solid #0a84ff;
}

.station-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background-size: cover;
    background-position: center;
    background-color: #2a2a2a;
}

.station-info {
    flex: 1;
}

.station-name {
    font-weight: 500;
    font-size: 14px;
}

.station-status {
    font-size: 11px;
    color: #888;
}

/* громкость */
.volume-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
}

#volume {
    flex: 1;
    appearance: none;
    height: 5px;
    border-radius: 5px;
    background: rgba(255,255,255,0.2);
    outline: none;
}

#volume::-webkit-slider-thumb {
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
}

/* подпись */
.footer {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 15px;
}

/* Индикатор LIVE */
.live-badge {
    background: #ff3b30;
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 12px;
    margin-left: 8px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* Ошибка загрузки */
.cover.error::before {
    content: "⚠️";
    color: #ff3b30;
}
</style>
</head>

<body>

<div class="player">
    <div id="cover" class="cover"></div>

    <div class="title" id="title">Station</div>
    <div class="subtitle" id="track">
        Загрузка...
        <span class="live-badge" id="liveIndicator" style="display: none;">LIVE</span>
    </div>

    <div class="controls">
        <button onclick="prev()">⏮</button>
        <button class="play" onclick="toggle()" id="playBtn">▶</button>
        <button onclick="next()">⏭</button>
    </div>

    <div class="volume-container">
        <span>🔉</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        <span>🔊</span>
    </div>

    <div class="list" id="list"></div>

    <div class="footer">
        Создал Максим ( ТГ MaxDiWay )
    </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
// Станции с ПРЯМЫМИ ССЫЛКАМИ на обложки (не picsum!)
const stations = [
    { 
        name: "LoFi Hip Hop", 
        stream: "https://stream.laut.fm/lofi",
        // Надёжная обложка с Unsplash (музыкальная тема)
        cover: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=300&h=300&fit=crop&auto=format"
    },
    { 
        name: "Rock Radio", 
        stream: "https://stream.laut.fm/rockradio",
        cover: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=300&h=300&fit=crop&auto=format"
    },
    { 
        name: "HypeFM", 
        stream: "https://air.volna.top/HypeFM",
        cover: "https://images.unsplash.com/photo-1571330735066-03aaa9429d89?w=300&h=300&fit=crop&auto=format"
    },
    { 
        name: "Русское Радио", 
        stream: "https://rusradio.hostingradio.ru/rusradio128.mp3",
        cover: "https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?w=300&h=300&fit=crop&auto=format"
    }
];

let index = 0;
let isPlaying = false;
const audio = document.getElementById("audio");
const volume = document.getElementById("volume");
const coverEl = document.getElementById("cover");
const titleEl = document.getElementById("title");
const trackEl = document.getElementById("track");
const playBtn = document.getElementById("playBtn");
const liveIndicator = document.getElementById("liveIndicator");

// Предзагрузка обложек для ускорения
function preloadImage(url) {
    const img = new Image();
    img.src = url;
}

stations.forEach(s => preloadImage(s.cover));

/* обложка — теперь берём из данных станции */
function updateCover(stationIndex) {
    const station = stations[stationIndex];
    const coverUrl = station.cover;
    
    // Устанавливаем обложку
    coverEl.style.backgroundImage = `url('${coverUrl}')`;
    coverEl.classList.remove('error');
    
    // Обработка ошибки загрузки (fallback)
    const img = new Image();
    img.onerror = () => {
        // Если Unsplash недоступен, используем градиент с иконкой
        coverEl.style.backgroundImage = `linear-gradient(135deg, #667eea 0%, #764ba2 100%)`;
        coverEl.classList.add('error');
        console.warn('Обложка не загрузилась, используем fallback');
    };
    img.src = coverUrl;
}

/* загрузка станции */
function load(i) {
    const s = stations[i];
    titleEl.innerText = s.name;
    trackEl.innerHTML = `LIVE RADIO <span class="live-badge">LIVE</span>`;
    
    // Останавливаем текущее
    if (isPlaying) {
        audio.pause();
        isPlaying = false;
        updatePlayButton();
    }
    
    audio.src = s.stream;
    updateCover(i);
    updateActiveStation(i);
    
    // Если играло — запускаем
    if (isPlaying) {
        audio.play().catch(e => console.log('Ожидание взаимодействия'));
    }
}

/* обновление активной станции в списке */
function updateActiveStation(activeIndex) {
    document.querySelectorAll('.station').forEach((el, idx) => {
        if (idx === activeIndex) {
            el.classList.add('active');
        } else {
            el.classList.remove('active');
        }
    });
}

/* play/pause */
function toggle() {
    if (!audio.src) {
        load(index);
    }
    
    if (audio.paused) {
        audio.play().then(() => {
            isPlaying = true;
            updatePlayButton();
        }).catch(e => {
            console.log('Автовоспроизведение заблокировано');
            isPlaying = false;
            updatePlayButton();
        });
    } else {
        audio.pause();
        isPlaying = false;
        updatePlayButton();
    }
}

function updatePlayButton() {
    playBtn.innerText = isPlaying ? "⏸" : "▶";
    liveIndicator.style.display = isPlaying ? "inline-block" : "none";
}

/* переключение */
function next() {
    index = (index + 1) % stations.length;
    load(index);
    if (isPlaying) {
        audio.play().catch(() => {});
    }
}

function prev() {
    index = (index - 1 + stations.length) % stations.length;
    load(index);
    if (isPlaying) {
        audio.play().catch(() => {});
    }
}

/* создание списка с иконками */
const list = document.getElementById("list");

stations.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "station";
    if (i === index) el.classList.add("active");
    
    el.innerHTML = `
        <div class="station-icon" style="background-image: url('${s.cover}')"></div>
        <div class="station-info">
            <div class="station-name">${s.name}</div>
            <div class="station-status">🎵 Радио</div>
        </div>
    `;
    
    el.onclick = () => {
        if (index === i) {
            // Если та же станция — просто play/pause
            toggle();
        } else {
            index = i;
            load(index);
            // Автозапуск при смене
            if (!isPlaying) {
                isPlaying = true;
            }
            audio.play().catch(() => {});
            updatePlayButton();
        }
    };
    
    list.appendChild(el);
});

/* громкость */
volume.addEventListener("input", () => {
    audio.volume = volume.value;
});

/* обработка событий аудио */
audio.addEventListener("play", () => {
    isPlaying = true;
    updatePlayButton();
});

audio.addEventListener("pause", () => {
    isPlaying = false;
    updatePlayButton();
});

audio.addEventListener("error", (e) => {
    console.error("Ошибка потока:", e);
    trackEl.innerHTML = `Ошибка загрузки <span style="color:#ff3b30;">⚠️</span>`;
    isPlaying = false;
    updatePlayButton();
});

audio.addEventListener("waiting", () => {
    trackEl.innerHTML = `Буферизация... <span class="live-badge">LIVE</span>`;
});

audio.addEventListener("playing", () => {
    trackEl.innerHTML = `LIVE RADIO <span class="live-badge">LIVE</span>`;
});

/* старт */
load(index);
audio.volume = volume.value;

// Периодическое обновление обложки? НЕТ, теперь обложка статическая и привязана к станции
// setInterval(updateCover, 10000); // УБИРАЕМ, обложка меняется только при смене станции
</script>

</body>
</html>
