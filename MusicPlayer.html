<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;

    /* ФОН */
    background: url("https://picsum.photos/800/1200?blur=2") no-repeat center/cover;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
    overflow: hidden;
    position: relative;
}

/* blur слой */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(40px);
    background: rgba(0,0,0,0.5);
}

/* glow */
body::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(0,150,255,0.2), transparent 60%);
}

/* Плеер */
.player {
    position: relative;
    z-index: 2;
    width: 320px;
    padding: 20px;
    border-radius: 30px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(25px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

/* Обложка */
.cover {
    width: 100%;
    height: 180px;
    border-radius: 20px;
    background-size: cover;
    background-position: center;
    margin-bottom: 15px;
    transition: 0.5s;
}

/* Текст */
.title {
    font-size: 18px;
    font-weight: 600;
}

.subtitle {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 10px;
}

/* Кнопки */
.controls {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

button {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: none;
    font-size: 20px;
    background: rgba(255,255,255,0.1);
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: rgba(255,255,255,0.3);
}

.play {
    width: 70px;
    height: 70px;
    font-size: 24px;
}

/* список */
.list {
    margin-top: 15px;
    max-height: 100px;
    overflow-y: auto;
    padding-right: 5px;
    scroll-behavior: smooth;
}

/* iPhone scroll */
.list::-webkit-scrollbar {
    width: 6px;
}

.list::-webkit-scrollbar-track {
    background: transparent;
}

.list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    backdrop-filter: blur(10px);
}

.list::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.5);
}

/* элементы */
.station {
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
}

.station:hover {
    background: rgba(255,255,255,0.1);
}

/* громкость */
.volume-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
}

#volume {
    flex: 1;
    appearance: none;
    height: 5px;
    border-radius: 5px;
    background: rgba(255,255,255,0.2);
    outline: none;
}

#volume::-webkit-slider-thumb {
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
}

/* подпись */
.footer {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="player">
    <div id="cover" class="cover"></div>

    <div class="title" id="title">Station</div>
    <div class="subtitle" id="track">Загрузка...</div>

    <div class="controls">
        <button onclick="prev()">⏮</button>
        <button class="play" onclick="toggle()">▶</button>
        <button onclick="next()">⏭</button>
    </div>

    <div class="volume-container">
        <span>🔉</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        <span>🔊</span>
    </div>

    <div class="list" id="list"></div>

    <div class="footer">
        Создал Максим ( ТГ MaxDiWay )
    </div>
</div>

<audio id="audio"></audio>

<script>
const stations = [
    { name: "LoFi Hip Hop", stream: "https://stream.laut.fm/lofi" },
    { name: "Deep House", stream: "https://stream.laut.fm/deepdance" },
    { name: "Rock Radio", stream: "https://stream.laut.fm/rockradio" }
];

let index = 0;
const audio = document.getElementById("audio");
const volume = document.getElementById("volume");

/* обложка */
function updateCover() {
    const random = Math.floor(Math.random() * 1000);
    document.getElementById("cover").style.backgroundImage =
        `url(https://picsum.photos/300?random=${random})`;
}

/* загрузка */
function load(i) {
    const s = stations[i];
    document.getElementById("title").innerText = s.name;
    document.getElementById("track").innerText = "LIVE RADIO";
    audio.src = s.stream;
    updateCover();
}

/* play */
function toggle() {
    const btn = document.querySelector(".play");

    if (audio.paused) {
        audio.play();
        btn.innerText = "⏸";
    } else {
        audio.pause();
        btn.innerText = "▶";
    }
}

/* переключение */
function next() {
    index = (index + 1) % stations.length;
    load(index);
    audio.play();
}

function prev() {
    index = (index - 1 + stations.length) % stations.length;
    load(index);
    audio.play();
}

/* список */
const list = document.getElementById("list");

stations.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "station";
    el.innerText = s.name;

    el.onclick = () => {
        index = i;
        load(index);
        audio.play();
    };

    list.appendChild(el);
});

/* громкость */
volume.addEventListener("input", () => {
    audio.volume = volume.value;
});

/* обновление обложки */
setInterval(updateCover, 10000);

/* старт */
load(index);
audio.volume = volume.value;
</script>

</body>
</html>
